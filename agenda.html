<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica</title>

    <!-- FullCalendar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #f5f5f5;
        }

       /* MENU */

.sidebar{
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100vh;
    background: #d8f1f8;
    padding: 30px 20px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    display:block;
    width:100%;
    padding:12px 18px;
    text-decoration:none;
    color:#000;
    font-size:16px;
    border-radius:12px;
    transition:.3s;
}

.menu a:hover,
.menu a.active{
    background:#fff;
}

        /* CONTEÚDO */

     .content{
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 40px;
        }

        /* TOPO */

       .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:30px;
        }

     .profissional{
            font-size:52px;
            font-weight:bold;
            margin:0;
        }

        .user-area{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .search{
            width:300px;
            height:46px;
            border:none;
            border-radius:30px;
            background:#d9e6ea;
            padding:0 20px;
            font-size:18px;
        }

        .user-img{
            width:65px;
            height:65px;
            border-radius:50%;
            background:#ccc;
        }

        /* HEADER */

        .calendar-header{
            margin:40px 0 25px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .add-btn {
            display: inline-block;
            background: #bfeaf3;
            color: #000;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: .3s;
        }

        .add-btn:hover {
            background: #9edce9;
        }

        /* CONTEÚDO PRINCIPAL */

        .main {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .calendar{
            width:100%;
            background:#fff;
            padding:20px;
            border-radius:20px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        #calendar {
            min-height: 700px;
        }

        /* RESPONSIVO */

        @media (max-width:1100px) {

            .sidebar{
                width:260px;
            }

            .content{
                margin-left:260px;
                width:calc(100% - 260px);
            }

            .main {
                flex-direction: column;
            }

            .calendar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- MENU -->

    <div class="sidebar">

        <div class="menu">
            <a href="perfil.html">Perfil</a>
            <a href="paciente.html">Paciente</a>
            <a href="ficha.html">Ficha de Pacientes</a>
            <a href="agenda.html" class="active">Agenda</a>
        </div>

    </div>

    <!-- CONTEÚDO -->

    <div class="content">

        <div class="top">

            <h1 class="profissional">
                Nome do Profissional
            </h1>

            <div class="user-area">

                <input type="text" class="search" placeholder="Pesquisar">

                <div class="user-img"></div>

            </div>

        </div>

        <div class="calendar-header">

            <h2>Agenda de Consultas</h2>

            <a href="consulta.html" class="add-btn">
                + Nova Consulta
            </a>

        </div>

        <div class="main">

            <div class="calendar">
                <div id="calendar"></div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const calendarEl = document.getElementById('calendar');

            const calendar = new FullCalendar.Calendar(calendarEl, {

                locale: 'pt-br',

                initialView: 'dayGridMonth',

                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },

                buttonText: {
                    today: 'Hoje',
                    month: 'Mês',
                    week: 'Semana',
                    day: 'Dia'
                },

                events: [

                    {
                        title: 'Consulta - Maria Silva',
                        start: '2026-01-05T08:00:00'
                    },

                    {
                        title: 'Consulta - João Souza',
                        start: '2026-01-10T14:00:00'
                    },

                    {
                        title: 'Consulta - Ana Costa',
                        start: '2026-01-15T16:00:00'
                    },

                    {
                        title: 'Retorno - Pedro Santos',
                        start: '2026-01-20T10:00:00'
                    }

                ]

            });

            calendar.render();

        });
    </script>

</body>

</html>
