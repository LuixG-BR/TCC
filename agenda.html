<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- FullCalendar -->

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    background:#f5f5f5;
}

/* MENU */

.sidebar{
    width:170px;
    background:#d8f1f8;
    height:100vh;
    padding-top:20px;
    position:fixed;
    left:0;
    top:0;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:20px;
    align-items:center;
}

.menu a{
    text-decoration:none;
    color:#000;
    font-size:18px;
    padding:12px 20px;
    border-radius:20px;
    transition:.3s;
}

.menu a:hover,
.menu a.active{
    background:#fff;
}

/* CONTEÚDO */

.content{
    margin-left:170px;
    width:calc(100% - 170px);
    padding:30px;
}

/* TOPO */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profissional{
    font-size:34px;
    font-weight:bold;
}

.user-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.search{
    width:220px;
    padding:10px;
    border:none;
    border-radius:20px;
    background:#d9e6ea;
}

.user-img{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ccc;
}

/* TABS */

.tabs{
    margin-top:30px;
    display:flex;
    gap:10px;
}

.tabs button{
    background:#fff;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.tabs .active{
    background:#bfeaf3;
}

/* HEADER */

.calendar-header{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.add-btn{
    background:#bfeaf3;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

/* CONTEÚDO PRINCIPAL */

.main{
    margin-top:20px;
    display:flex;
    gap:20px;
}

.calendar{
    width:70%;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

#calendar{
    min-height:700px;
}

/* PAINEL DIREITO */

.info-panel{
    width:30%;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
    margin-bottom:15px;
    color:#6bbfd1;
}

.info-item{
    margin-bottom:10px;
}

.bottom-icons{
    display:flex;
    justify-content:space-around;
    font-size:24px;
}

/* RESPONSIVO */

@media(max-width:1000px){

    .sidebar{
        display:none;
    }

    .content{
        margin-left:0;
        width:100%;
    }

    .main{
        flex-direction:column;
    }

    .calendar,
    .info-panel{
        width:100%;
    }

}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>

document.addEventListener('DOMContentLoaded', function(){

    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {

        locale:'pt-br',

        initialView:'dayGridMonth',

        headerToolbar:{
            left:'prev,next today',
            center:'title',
            right:'dayGridMonth,timeGridWeek,timeGridDay'
        },

        buttonText:{
            today:'Hoje',
            month:'Mês',
            week:'Semana',
            day:'Dia'
        },

        events:[

            {
                title:'Consulta - Maria Silva',
                start:'2026-01-05T08:00:00',
                extendedProps:{
                    local:'Consultório 01',
                    paciente:'Maria Silva'
                }
            },

            {
                title:'Consulta - João Souza',
                start:'2026-01-10T14:00:00',
                extendedProps:{
                    local:'Consultório 02',
                    paciente:'João Souza'
                }
            },

            {
                title:'Consulta - Ana Costa',
                start:'2026-01-15T16:00:00',
                extendedProps:{
                    local:'Consultório 03',
                    paciente:'Ana Costa'
                }
            },

            {
                title:'Retorno - Pedro Santos',
                start:'2026-01-20T10:00:00',
                extendedProps:{
                    local:'Consultório 01',
                    paciente:'Pedro Santos'
                }
            }

        ],

        eventClick:function(info){

            const dataConsulta = info.event.start;

            document.getElementById('horario').innerHTML =
                '⏰ ' +
                dataConsulta.toLocaleTimeString('pt-BR',{
                    hour:'2-digit',
                    minute:'2-digit'
                });

            document.getElementById('data').innerHTML =
                '📅 ' +
                dataConsulta.toLocaleDateString('pt-BR');

            document.getElementById('local').innerHTML =
                '📍 ' +
                info.event.extendedProps.local;

            document.getElementById('paciente').innerHTML =
                '👤 ' +
                info.event.extendedProps.paciente;

        }

    });

    calendar.render();

});

</script>



</body>
</html>
